<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="cam-ins 的个人网站。">
  <title>cam-ins</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101719; color: #eef5f1; padding: 24px; }
    main { width: min(100%, 680px); padding: clamp(28px, 7vw, 64px); border: 1px solid #344b42; border-radius: 24px; background: #18231e; }
    .label { color: #94c6ab; font-size: 14px; letter-spacing: .12em; }
    h1 { font-size: clamp(44px, 10vw, 80px); margin: 20px 0; letter-spacing: -.05em; }
    p { line-height: 1.8; color: #bdcdc4; }
    a { display: inline-block; margin-top: 24px; color: #aaf0c5; text-underline-offset: 5px; }
    a:focus-visible { outline: 2px solid #aaf0c5; outline-offset: 6px; }
    footer { margin-top: 48px; color: #91a599; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="label">HELLO, WORLD</div>
    <h1>cam-ins</h1>
    <p>欢迎来到我的网站。<br>这是一个开始，更多内容将陆续更新。</p>
    <a href="https://github.com/cam-ins">访问 GitHub →</a>
    <footer>cam-ins.github.io · 2026</footer>
  </main>
</body>
</html>
