name: Community Pages

on:
  push:
    branches: [main]
  discussion:
    types: [created, edited, deleted, answered, unanswered, category_changed, labeled, unlabeled, locked, unlocked, pinned, unpinned]
  discussion_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: community-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      discussions: read
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch public Markdown discussions
        run: pnpm sync
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm test
      - run: pnpm build
      - name: Verify generated pages and links
        run: node scripts/verify-build.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
